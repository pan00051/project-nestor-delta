[build-system]
# Declared explicitly. Without this table pip falls back to a legacy
# setuptools path, and an older pip then refuses `-e` outright with
# "File setup.py or setup.cfg not found" - which is what the documented
# install command did on the author's own macOS Python 3.9 venv (pip 21.2.4).
# PEP 660 editable installs additionally require pip >= 21.3; see
# REPRODUCIBILITY.md.
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nestor-delta"
version = "0.1.0"
description = "Deterministic relationship reliability analysis for multivariate time series."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    # The complete suite is pytest-collected: the 26 ground-truth tests are
    # plain functions, not unittest.TestCase. >=7 is required for the
    # `pythonpath` ini option below.
    "pytest>=7",
    # tests/test_api_boundary.py imports these three at module scope, so a bare
    # `pytest` fails at COLLECTION without them - not at assertion. Declaring
    # only pytest here made README's documented reproduction command false on
    # any clean machine, which is the one claim this project cannot afford to
    # get wrong. `httpx` is required by starlette's TestClient, which raises a
    # RuntimeError on import when it is absent.
    "jsonschema>=4,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    # tests/ground_truth/generate_ground_truth.py imports numpy and pandas, so
    # the across-seeds false-positive test cannot even import without them.
    # Before these two lines the complete suite only passed on machines that had
    # also installed the `web` extra, because streamlit pulls both in
    # transitively - an accident of the environment, not a declaration.
    "numpy>=1.21",
    "pandas>=1.3",
]
web = [
    "fastapi>=0.115,<1",
    "requests>=2.31,<3",
    "streamlit>=1.36,<2",
    "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.nestor_delta]
evaluation_protocol = "EVALUATION.md"
report_schema = "delta.report.v1"
current_milestone = "S1-S10 and Website W0-W5 complete"
current_sprint = "Awaiting next-sprint decision"

[tool.pytest.ini_options]
# Makes a bare `pytest` collect the complete suite (179). Without them a bare
# `pytest` fails to import, and the 26 ground-truth tests - the only ones that
# check whether the detector detects - are easy to omit by accident.
# This does NOT affect `unittest discover`, which cannot collect the
# ground-truth tests at all: they are plain functions, not unittest.TestCase.
pythonpath = ["src", "tests/ground_truth"]
testpaths = ["tests"]
markers = [
    "slow: slow-running tests",
]
